name: tmp-check
on: push
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install > /tmp/install.log 2>&1 || (tail -30 /tmp/install.log; exit 1)
      - id: t
        run: |
          set +e
          npm run build > /tmp/build.log 2>&1; b=$?
          npm test > /tmp/test.log 2>&1; t=$?
          echo "code=$b/$t" >> $GITHUB_OUTPUT
      - if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "tmp-check build/test exit ${{ steps.t.outputs.code }}"; echo '```'; grep -E "error TS|FAIL|✗|×" /tmp/build.log /tmp/test.log | head -40; echo ---; tail -12 /tmp/build.log; echo ---; grep -E "Test Files|Tests " /tmp/test.log; tail -15 /tmp/test.log; echo '```'; } > /tmp/c.md
          gh pr comment 156 --repo ${{ github.repository }} --body-file /tmp/c.md
