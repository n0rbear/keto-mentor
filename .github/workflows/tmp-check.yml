name: tmp-check
on: push
permissions:
  contents: read
  pull-requests: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install > /tmp/install.log 2>&1 || (tail -30 /tmp/install.log; exit 1)
      - id: t
        run: |
          set +e
          { npm run build -w packages/shared && npm run build -w apps/web && cd apps/web && npx vitest run src/legal-pages.test.tsx; } > /tmp/out.log 2>&1
          echo "code=$?" >> $GITHUB_OUTPUT
      - if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          { echo "tmp-check exit ${{ steps.t.outputs.code }}"; echo '```'; tail -40 /tmp/out.log; echo '```'; } > /tmp/c.md
          gh pr comment 155 --repo ${{ github.repository }} --body-file /tmp/c.md
      - if: steps.t.outputs.code != '0'
        run: exit 1
