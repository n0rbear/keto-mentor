services:
  - type: web
    name: keto-mentor-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build -w packages/shared && npm run build -w apps/api && npm prune --omit=dev
    startCommand: npm run render:postdeploy && npm run start -w apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://ketomentor.norbapp.com,https://keto-mentor-web.onrender.com
  - type: web
    name: keto-mentor-web
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build -w packages/shared && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://keto-mentor-api.onrender.com
